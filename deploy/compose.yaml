services:
  api:
    build:
      context: ..
    image: autonomyos:completion
    platform: linux/amd64
    ports: ["127.0.0.1:8013:8000"]
    environment:
      AUTONOMY_PUBLIC_DEMO: "false"
      AUTONOMY_DATABASE_PATH: /data/missions.sqlite3
      AUTONOMY_WORKFLOW_DIRECTORY: /data/workflows
      AUTONOMY_OPERATIONS_DIRECTORY: /data/operations
      AUTONOMY_TRACES_DIRECTORY: /data/traces
      AUTONOMY_OPERATOR_ACCOUNTS_JSON: ${AUTONOMY_OPERATOR_ACCOUNTS_JSON:-[]}
      AUTONOMY_OPERATOR_TOKEN: ${AUTONOMY_OPERATOR_TOKEN:-}
    volumes: ["evidence:/data"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
  worker:
    image: autonomyos:completion
    platform: linux/amd64
    command: ["python", "-m", "scripts.job_worker", "--root", "/data/operations"]
    healthcheck:
      disable: true
    volumes: ["evidence:/data"]
    environment:
      AUTONOMY_PUBLIC_DEMO: "false"
      AUTONOMY_PLANNER_MODE: rule_based
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
volumes:
  evidence:

apiVersion: v1
kind: Namespace
metadata:
  name: autonomyos-validation
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: portfolio-quota
  namespace: autonomyos-validation
spec:
  hard:
    pods: "4"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    requests.storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evidence
  namespace: autonomyos-validation
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: autonomyos-validation
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: autonomyos-api}
  template:
    metadata:
      labels: {app: autonomyos-api}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: autonomyos:completion
          imagePullPolicy: Never
          ports: [{containerPort: 8000}]
          env:
            - {name: AUTONOMY_PUBLIC_DEMO, value: "false"}
            - {name: AUTONOMY_DATABASE_PATH, value: /data/missions.sqlite3}
            - {name: AUTONOMY_WORKFLOW_DIRECTORY, value: /data/workflows}
            - {name: AUTONOMY_OPERATIONS_DIRECTORY, value: /data/operations}
            - {name: AUTONOMY_TRACES_DIRECTORY, value: /data/traces}
            - name: AUTONOMY_OPERATOR_TOKEN
              valueFrom: {secretKeyRef: {name: operator-auth, key: token}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 30, periodSeconds: 15}
          volumeMounts: [{name: evidence, mountPath: /data}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: evidence, persistentVolumeClaim: {claimName: evidence}}, {name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: autonomyos-validation
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: autonomyos-worker}
  template:
    metadata:
      labels: {app: autonomyos-worker}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: autonomyos:completion
          imagePullPolicy: Never
          command: [python, -m, scripts.job_worker, --root, /data/operations]
          env: [{name: AUTONOMY_PLANNER_MODE, value: rule_based}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
          volumeMounts: [{name: evidence, mountPath: /data}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: evidence, persistentVolumeClaim: {claimName: evidence}}, {name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: autonomyos-validation
spec:
  selector: {app: autonomyos-api}
  ports: [{port: 8000, targetPort: 8000}]
